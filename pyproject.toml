[build-system]
requires = ["setuptools>=64", "cffi>=1.15.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quiver"
version = "0.1.0"
description = "Terminal-based options book with finite difference pricing and Greeks"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Paul"}
]
keywords = ["options", "pricing", "greeks", "trading", "tui", "finite-difference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "cffi>=1.15.0",
    "textual>=0.47.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "textual-dev>=1.0.0",
]

[project.scripts]
quiver = "quiver.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quiver = ["ui/styles/*.tcss"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 88
target-version = "py310"
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "7.0"
asyncio_mode = "auto"
testpaths = ["tests"]
